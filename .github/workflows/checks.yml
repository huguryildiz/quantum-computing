name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Syntax check
        run: for f in build/src/[789]*.js; do node --check "$f"; done

      - name: Artifact is rebuilt from its sources
        run: |
          cd build && node build.js
          git diff --exit-code --stat -- ../dist/Quantum_Computing.html

      - name: Numerical checks
        run: |
          python verify/verify_scenes.py
          python verify/verify_drills.py
          python -m pytest verify/ .claude/hooks/ -q

      - name: Code pages (NumPy half; the Qiskit half runs locally)
        run: python verify/code_check.py

      - name: Text rules
        run: |
          python tools/rule_check.py "build/src/8[1-9]_scenes*.js" "build/src/9[2-8]_drill_m*.js" "build/src/7[0-9]_labs*.js" "build/src/7*_code*.js" "notes/src/*.js" "web/index.html"
